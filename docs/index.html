<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Passport — BNB Chain Agent ID Hackathon</title>
<style>
  :root { --bg:#0b0e14; --card:#12161f; --line:#232a36; --txt:#e6e9f0; --dim:#8b93a7; --acc:#f0b90b; --ok:#2ecc8f; --bad:#ff5c7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:15px/1.55 ui-monospace,'SF Mono',Menlo,Consolas,monospace; min-height:100vh; padding:40px 16px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:20px; letter-spacing:.5px; }
  h1 span { color:var(--acc); }
  .sub { color:var(--dim); font-size:12.5px; margin:6px 0 24px; }
  .search { display:flex; gap:8px; margin-bottom:20px; }
  input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt); padding:12px 14px; border-radius:8px; font:inherit; outline:none; }
  input:focus { border-color:var(--acc); }
  button { background:var(--acc); color:#111; border:0; padding:12px 20px; border-radius:8px; font:inherit; font-weight:700; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:16px; }
  .handle { font-size:22px; font-weight:700; color:var(--acc); margin-bottom:4px; }
  .wallet { color:var(--dim); font-size:12.5px; word-break:break-all; }
  .wallet a { color:var(--acc); text-decoration:none; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px; }
  .stat { background:#0d1119; border:1px solid var(--line); border-radius:8px; padding:12px; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .row { display:flex; justify-content:space-between; border-top:1px dashed var(--line); padding:9px 0; font-size:13px; }
  .row:first-of-type { margin-top:14px; border-top:0; }
  .row span:first-child { color:var(--dim); }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:11px; font-weight:700; }
  .pill.ok { background:#12331f; color:var(--ok); }
  .pill.bad { background:#3a1420; color:var(--bad); }
  .err { color:var(--bad); background:#2a1119; border:1px solid #4a1a2a; padding:14px; border-radius:8px; font-size:13px; }
  .foot { color:var(--dim); font-size:11.5px; margin-top:28px; text-align:center; }
  .foot a { color:var(--acc); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AGENT <span>PASSPORT</span></h1>
  <div class="sub">on-chain reputation for BNB Chain Agent IDs &middot; resolve a handle or paste a wallet</div>
  <div class="search">
    <input id="q" placeholder="loagent or 0x…" spellcheck="false">
    <button onclick="go()">Resolve</button>
  </div>
  <div id="out"></div>
  <div class="foot">
    PassportRegistry <a href="https://testnet.bscscan.com/address/0x007618dCaD3d47D6C5c183c9A3FE29053dE47d13#code" target="_blank">0x007618dC…7d13</a>
    &middot; BSC Testnet &middot; <a href="https://github.com/Alfonova-Node/agent-passport" target="_blank">open source</a>
  </div>
</div>
<script>
const RPC = "https://bsc-testnet.publicnode.com";
const REG = "0x007618dCaD3d47D6C5c183c9A3FE29053dE47d13";
const SEL = { resolve:"0x461a4478", passports:"0xe37c132b", claimed:"0xc884ef83" };
const isAddr = s => /^0x[0-9a-fA-F]{40}$/.test(s);
const isHandle = s => /^[a-z0-9]{1,64}$/.test(s);

async function rpc(method, params) {
  const r = await fetch(RPC, { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ jsonrpc:"2.0", id:1, method, params }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result;
}
const pad = s => s.replace(/^0x/, "").padStart(64, "0");
const word = (d, i) => "0x" + d.slice(i*64, (i+1)*64);
const wInt = h => BigInt(h);
const wAddr = h => "0x" + h.slice(24);

async function ethCall(data) {
  return (await rpc("eth_call", [{ to: REG, data }, "latest"]));
}

// resolve(string) -> (address wallet, Stats(uint64,uint64,uint64,uint128,uint64,uint64), string reverse)
async function resolveHandle(h) {
  const enc = new TextEncoder().encode(h);
  const len = pad(enc.length.toString(16));
  const str = Array.from(enc).map(b => b.toString(16).padStart(2, "0")).join("").padEnd(Math.ceil(enc.length/32)*64, "0");
  const data = SEL.resolve + pad("20") + len + str;
  const raw = (await ethCall(data)).replace(/^0x/, "");
  const wallet = wAddr(word(raw, 0));
  if (wallet === "0x" + "0".repeat(40)) return null;
  const stats = [1,2,3,4,5,6].map(i => wInt(word(raw, i)));
  const off = Number(wInt(word(raw, 7)));
  const slen = Number(wInt(word(raw, off/32)));
  const reverse = new TextDecoder().decode(
    new Uint8Array(raw.slice((off+32)*2, (off+32)*2 + slen*2).match(/.{2}/g).map(x => parseInt(x, 16))));
  return { wallet, stats, reverse };
}

// passports(address) -> Stats tuple
async function readWallet(a) {
  const claimed = wInt(await ethCall(SEL.claimed + pad(a.slice(2))));
  if (!claimed) return null;
  const raw = (await ethCall(SEL.passports + pad(a.slice(2)))).replace(/^0x/, "");
  const stats = [0,1,2,3,4,5].map(i => wInt(word(raw, i)));
  return { wallet: a, stats, reverse: "" };
}

function fmtVol(raw) {
  const v = BigInt(raw);
  const whole = v / 10n**18n, frac = (v % 10n**18n).toString().padStart(18, "0").slice(0, 4);
  return `${whole}.${frac}`;
}
const fmtTime = ts => ts ? new Date(Number(ts)*1000).toISOString().slice(0,16).replace("T"," ") : "—";

function render(r, handle) {
  const [c, rj, e, vol, last, epoch] = r.stats.map(Number);
  const total = c + rj + e;
  const rate = total ? Math.round(c/total*100) : 0;
  document.getElementById("out").innerHTML = `
    <div class="card">
      <div class="handle">${r.reverse ? r.reverse : (handle ? handle+".ai" : "unclaimed wallet")}</div>
      <div class="wallet">${r.wallet} &middot; <a href="https://testnet.bscscan.com/address/${r.wallet}" target="_blank">bscscan ↗</a></div>
      <div class="grid">
        <div class="stat"><b>${c}</b><span>completed</span></div>
        <div class="stat"><b>${rj}</b><span>rejected</span></div>
        <div class="stat"><b>${e}</b><span>expired</span></div>
      </div>
      <div class="row"><span>completion rate</span><span class="pill ${rate>=80?"ok":"bad"}">${rate}%</span></div>
      <div class="row"><span>settled volume</span><span>${fmtVol(vol)} raw units</span></div>
      <div class="row"><span>last settled</span><span>${fmtTime(last)}</span></div>
      <div class="row"><span>epoch</span><span>${epoch}</span></div>
      <div class="row"><span>status</span><span class="pill ok">CLAIMED</span></div>
    </div>`;
}

async function go() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const out = document.getElementById("out");
  out.innerHTML = `<div class="err">resolving…</div>`;
  try {
    if (isAddr(q)) {
      const r = await readWallet(q);
      r ? render(r, null) : out.innerHTML = `<div class="err">no passport claimed by this wallet.</div>`;
    } else if (isHandle(q)) {
      const r = await resolveHandle(q);
      r ? render(r, q) : out.innerHTML = `<div class="err">handle "${q}" is not registered in the Agent ID registry.</div>`;
    } else {
      out.innerHTML = `<div class="err">enter a handle (a-z0-9) or a 0x wallet address.</div>`;
    }
  } catch (ex) {
    out.innerHTML = `<div class="err">RPC error: ${ex.message}</div>`;
  }
}
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
go && (window.onload = () => { const q = new URLSearchParams(location.search).get("h"); if (q) { document.getElementById("q").value = q; go(); } });
</script>
</body>
</html>
